services:
  boot-dev:
    build:
      context: .
      network: host
    container_name: boot-dev
    volumes:
      - .:/workspace
      - bootdev-config:/home/dev/.bootdev
      - bootdev-opencode-data:/home/dev/.local/share/opencode
    working_dir: /workspace
    stdin_open: true
    tty: true

volumes:
  bootdev-config:
  bootdev-opencode-data:
